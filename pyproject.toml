[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambu-runtime-agents"
version = "1.5.1"
description = "Supervisory controller for OpenCode coding agents with anti-loop verification and smart intent routing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Frank Zhang", email = "zheshuang.zhang@yahoo.ca"}
]
keywords = ["agents", "ai", "opencode", "control-plane", "automation", "anti-loop", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/zzhang82/ambu-runtime-agents"
Repository = "https://github.com/zzhang82/ambu-runtime-agents"

[project.scripts]
agentctl = "runtime_agents.cli:main"
agentd = "runtime_agents.daemon:main"
agentbot = "runtime_agents.telegram_bot:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
runtime_agents = ["default_profiles.yaml", "default_tools.yaml", "default_runbooks/*.md"]

[tool.setuptools.packages.find]
where = ["src"]
