version: 0.1
mode: observe_recommend_only

global_rules:
  no_auto_forge: true
  no_auto_deploy: true
  no_auto_commit: true
  no_auto_lock_update: true
  no_raw_transcript_dump: true
  require_approval_for_mutation: true

runtimes:
  claude_ccr:
    fidelity: high
    enabled: true
  opencode:
    fidelity: high
    enabled: true
  runtime_agents:
    fidelity: high
    enabled: true
  codex:
    fidelity: high
    enabled: true
  gemini:
    fidelity: high
    enabled: true

triggers:
  post_run:
    enabled: true
    action: write_agent_run_event
    mode: observe

  scan_every_n_events:
    enabled: true
    n: 20
    event_filter:
      fidelity: high
    action: runtime_self_improve_scan
    mode: recommend

  suggest_every_n_events:
    enabled: true
    n: 100
    event_filter:
      fidelity: high
    action: runtime_self_improve_suggest
    mode: recommend

  similar_failures:
    enabled: true
    threshold: 3
    window_events: 50
    action: repo_workflow_cartographer_focused_scan
    mode: recommend

  session_start_resume:
    enabled: true
    action: recommend_session_bridge_assembler
    mode: recommend

  first_contact_repo:
    enabled: true
    action: recommend_repo_architecture_sensor
    mode: recommend

  skill_store_changed:
    enabled: true
    action:
      - runtime_self_improve_skills_verify
      - recommend_skill_deployment_verifier
    mode: recommend

  release_files_changed:
    enabled: true
    files:
      - pyproject.toml
      - package.json
      - Cargo.toml
      - go.mod
      - VERSION
      - CHANGELOG.md
      - README.md
    action: recommend_version_sync_sculptor_verify_only
    mode: recommend

  dirty_after_release_or_burn_in:
    enabled: true
    action: recommend_agent_hygiene_auditor
    mode: recommend
